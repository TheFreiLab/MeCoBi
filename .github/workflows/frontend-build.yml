name: frontend-build-consistency

# Ensures the committed production bundle (src/mecobi/web/static) matches a fresh
# build of frontend/src. Runs on changes to either the source or the bundle.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/mecobi/web/static/**"
      - "scripts/check_frontend_build.sh"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "src/mecobi/web/static/**"

# A newer commit on the same PR/branch cancels the run still in progress (saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Check committed bundle is up to date
        run: bash scripts/check_frontend_build.sh
